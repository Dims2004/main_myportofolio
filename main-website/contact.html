<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Kontak</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <script>if(localStorage.getItem("theme")==="dark"){document.body.classList.add("dark-mode");}</script>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html"><i class="fas fa-code"></i> MyPortfolio</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="about.html">Tentang</a></li>
                <li><a href="projects.html">Proyek</a></li>
                <li><a href="contact.html" class="active">Kontak</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Navbar Overlay -->
    <div class="nav-overlay" id="navOverlay"></div>

    <!-- ===== CONTACT SECTION ===== -->
    <section class="contact-page">
        <div class="container">
            <h1 class="page-title">Hubungi Saya</h1>

            <div class="contact-wrapper">
                <!-- ===== CONTACT INFO (LEFT) ===== -->
                <div class="contact-info">
                    <div class="contact-details">
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                            <div class="contact-text">
                                <h4>Lokasi</h4>
                                <p id="contactLokasi">Memuat...</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                            <div class="contact-text">
                                <h4>Email</h4>
                                <p><a id="contactEmail" href="#">Memuat...</a></p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-phone"></i></div>
                            <div class="contact-text">
                                <h4>Telepon</h4>
                                <p><a id="contactTelepon" href="#">Memuat...</a></p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-clock"></i></div>
                            <div class="contact-text">
                                <h4>Jam Kerja</h4>
                                <p id="contactJamKerja">Memuat...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Social Links -->
                    <div class="contact-social">
                        <h4>Connect With Me</h4>
                        <div class="social-icons" id="contactSocial"></div>
                    </div>
                </div>

                <!-- ===== CONTACT FORM (RIGHT) ===== -->
                <div class="contact-form">
                    <h3>Kirim Pesan</h3>
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name"><i class="fas fa-user"></i> Nama Lengkap</label>
                            <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
                        </div>
                        <div class="form-group">
                            <label for="email"><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
                        </div>
                        <div class="form-group">
                            <label for="subject"><i class="fas fa-tag"></i> Subjek</label>
                            <input type="text" id="subject" name="subject" placeholder="Masukkan subjek" required>
                        </div>
                        <div class="form-group">
                            <label for="message"><i class="fas fa-comment"></i> Pesan</label>
                            <textarea id="message" name="message" rows="5" placeholder="Tulis pesan Anda..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-paper-plane"></i> Kirim Pesan
                        </button>
                    </form>
                </div>
            </div>

            <!-- ===== MAP SECTION ===== -->
            <div class="map-section">
                <iframe
                    id="contactMap"
                    src=""
                    width="100%"
                    height="400"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Map Lokasi">
                </iframe>
                <div class="map-caption">
                    <i class="fas fa-map-pin"></i><span id="contactMapCaption"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <h3><i class="fas fa-code"></i> MyPortfolio</h3>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 MyPortfolio. All Rights Reserved.</p>
                <div class="footer-bottom-links"></div>
            </div>
        </div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/firebase-config.js"></script>
    <script src="js/default-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
    <script src="js/render-contact.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
